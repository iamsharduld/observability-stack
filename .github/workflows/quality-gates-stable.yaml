name: Stable quality gate

# Test candidate on SolQA, then release the tested revisions to stable.
# Manual dispatch is the release sign-off; dry runs are the default.

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "SolQA cluster (check workflow-coordinator for locks)"
        type: choice
        default: dh1_j8_1
        options:
          - dh1_j8_1
          - dh1_j8_2
          - dh1_j9_1
      dry_run:
        description: "Print release commands without releasing"
        type: boolean
        default: true

jobs:
  branches:
    name: ${{ matrix.branch }}
    strategy:
      fail-fast: false
      # Branches share one SolQA cluster
      max-parallel: 1
      matrix:
        # Maintenance tracks only; dev is never released to stable.
        branch: [track/3.0]
    uses: ./.github/workflows/_quality-gate-stable-branch.yaml
    secrets: inherit
    with:
      branch: ${{ matrix.branch }}
      cluster: ${{ inputs.cluster }}
      dry_run: ${{ inputs.dry_run }}
