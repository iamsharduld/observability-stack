name: Test and release a branch to stable

# Skip unchanged candidates, test both products, then release from metrics.json.

on:
  workflow_call:
    inputs:
      branch:
        description: "Terraform branch to deploy (e.g. track/3.0)"
        required: true
        type: string
      cluster:
        description: "SolQA cluster"
        required: true
        type: string
      dry_run:
        description: "Print release commands without releasing"
        required: true
        type: boolean
    secrets:
      TERRAGRUNT_DEPLOYMENT_PIPELINES_TOKEN:
        required: true
      CHARMHUB_TOKEN:
        required: true

env:
  SOLQA_REPO: canonical/terragrunt-deployment-pipelines
  BRANCH: ${{ inputs.branch }}

defaults:
  run:
    # Explicit bash enables pipefail for commands piped through tee.
    shell: bash

jobs:
  compare:
    name: Check for new revisions
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The recipes read the branch's Terraform modules through git
          fetch-depth: 0

      - name: Install dependencies
        run: sudo snap install just --classic

      - name: Compare with stable
        id: compare
        run: |
          changed=false
          for product in cos cos-lite; do
            just solution pin "$product" "origin/$BRANCH" candidate > candidate.json
            if ! just solution pin "$product" "origin/$BRANCH" stable > stable.json ||
               ! jq -se 'map(map(del(.channel))) | .[0] == .[1]' candidate.json stable.json > /dev/null; then
              changed=true
            fi
          done
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "false" ]; then
            echo "Nothing to do: /stable already holds the /candidate revisions." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: Test ${{ matrix.product }} on SolQA
    needs: [compare]
    if: needs.compare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # SolQA keeps only one waiting run per cluster and cancels older ones
      max-parallel: 1
      matrix:
        product: [cos, cos-lite]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo snap install just --classic

      # The remote executor runs small Go programs
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      - name: Build SolQA inputs
        id: inputs
        env:
          PRODUCT: ${{ matrix.product }}
          CLUSTER: ${{ inputs.cluster }}
        run: |
          # SolQA expects the nested inputs as JSON strings.
          json=$(jq -nc '{
            type: "solution",
            substrate: "maas_physical",
            product: env.PRODUCT,
            cluster: env.CLUSTER,
            version_overrides: ({cos: {ref: env.BRANCH, risk: "candidate"}} | tojson),
            test_parameters: ({repo: env.GITHUB_REPOSITORY, ref: env.GITHUB_SHA, args: [env.PRODUCT]} | tojson)
          }')
          echo "json=$json" >> "$GITHUB_OUTPUT"
          # Allow for clock differences when identifying the remote run.
          echo "started_at=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run on SolQA
        id: solqa
        # Inspect artifacts even when the remote workflow fails.
        continue-on-error: true
        uses: canonical/sqa-shared-ci/.github/actions/remote_github_workflow_executor@29bf1458526c8b6619bd98a1c0f2d272ee1f7216
        with:
          github_token: ${{ secrets.TERRAGRUNT_DEPLOYMENT_PIPELINES_TOKEN }}
          target_repo_owner: canonical
          target_repo_name: terragrunt-deployment-pipelines
          target_workflow: deploy.yaml
          target_ref: main
          workflow_inputs_json: ${{ steps.inputs.outputs.json }}

      - name: Download the run's result files
        env:
          GH_TOKEN: ${{ secrets.TERRAGRUNT_DEPLOYMENT_PIPELINES_TOKEN }}
          RUN_ID: ${{ steps.solqa.outputs.run_id }}
          STARTED_AT: ${{ steps.inputs.outputs.started_at }}
          EXPECTED_TITLE: "${{ matrix.product }} on maas_physical (${{ inputs.cluster }})"
        run: |
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: the SolQA run was not started." >&2
            exit 1
          fi
          echo "SolQA run: https://github.com/${SOLQA_REPO}/actions/runs/${RUN_ID}" | tee -a "$GITHUB_STEP_SUMMARY"
          # The executor may follow someone else's concurrently dispatched run.
          run=$(gh api "repos/${SOLQA_REPO}/actions/runs/${RUN_ID}")
          title=$(jq -r .display_title <<< "$run")
          created=$(jq -r .created_at <<< "$run")
          if [ "$title" != "$EXPECTED_TITLE" ] || [[ "$created" < "$STARTED_AT" ]]; then
            echo "ERROR: run ${RUN_ID} ('${title}', created ${created}) is not the one this job started." >&2
            exit 1
          fi
          mkdir -p results
          for file in test_results.xml metrics.json; do
            gh run download "$RUN_ID" -R "$SOLQA_REPO" -n "$file" -D results \
              || echo "WARNING: run ${RUN_ID} has no ${file}"
          done

      - name: Check the test result
        run: |
          if [ ! -f results/test_results.xml ]; then
            echo "ERROR: no test result: the lab or pipeline failed before our tests ran. Start the workflow again." >&2
            exit 1
          fi
          python3 - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          results = {
              case.get("name"): case.find("failure") is None and case.find("error") is None
              for case in ET.parse("results/test_results.xml").iter("testcase")
          }
          failed = [name for name, passed in results.items() if not passed]
          print(f"{len(results)} check(s) ran; failed: {', '.join(failed) or 'none'}")
          sys.exit(1 if failed or not results else 0)
          EOF

      - name: Record the tested revisions
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          mkdir tested
          just solution tested "$PRODUCT" "origin/${BRANCH}" results/metrics.json | tee "tested/${PRODUCT}.json"

      - name: Upload the tested revisions
        uses: actions/upload-artifact@v4
        with:
          name: tested-${{ matrix.product }}
          path: tested/

  release:
    name: Release to stable
    needs: [compare, test]
    if: needs.compare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the tested revisions
        uses: actions/download-artifact@v4
        with:
          pattern: tested-*
          path: tested
          merge-multiple: true

      - name: Install dependencies
        run: |
          sudo snap install just --classic
          sudo snap install charmcraft --classic

      - name: Release the tested revisions
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # COS and COS Lite share charms: release each revision once
          jq -s 'add | unique' tested/cos.json tested/cos-lite.json > all.json
          just solution release-pinned all.json stable amd64 "$DRY_RUN" | tee -a "$GITHUB_STEP_SUMMARY"
